# Automatic checks that run on GitHub whenever the source is pushed (or from the Actions tab: "Run workflow").
# Put this source folder in a GitHub repository and these four jobs run by themselves; nothing here needs a Windows PC of your own.
name: build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The parts that do not need Windows (maths, parsing, the weather and holiday data, the installer's folder check), with the
  # address and undefined-behaviour checkers switched on.
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run_all.sh

  # Builds Meridian.exe and the setup wizard exactly as build.sh does for you. Any compiler warning fails this job.
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the compiler
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 python3
      - name: Meridian.exe (release)
        run: MERIDIAN_WERROR=1 ./build.sh
      - name: The test build (build-dev/Meridian-dev.exe, never overwrites Meridian.exe)
        run: MERIDIAN_WERROR=1 MERIDIAN_DEV=1 ./build.sh
      - name: Verify release Meridian.exe has no development switches
        run: |
          python3 -c "raw=open('Meridian.exe','rb').read(); assert b'--shot' not in raw and '--shot'.encode('utf-16le') not in raw and b'--bench' not in raw and '--bench'.encode('utf-16le') not in raw, 'Release Meridian.exe contains MERIDIAN_DEV switches!'; print('Release Meridian.exe verified clean')"
      - name: Setup wizard
        run: MERIDIAN_WERROR=1 ./setup/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Meridian-build
          path: |
            Meridian.exe
            setup/Meridian-Setup-*.exe

  # The same build with build.bat on a real Windows machine, so the Windows way of building cannot quietly break.
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
      - name: build.bat
        run: MERIDIAN_WERROR=1 cmd.exe //c build.bat
      - name: build-setup.bat
        run: MERIDIAN_WERROR=1 cmd.exe //c setup\\build-setup.bat

  # Draws every face, theme and settings page off-screen with the test build under Wine and checks each picture is real.
  # It cannot judge looks and Wine is not Windows, so a failure here is a reason to look, not proof of a bug (it does not block the others).
  wine-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Wine and the compiler
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y mingw-w64 python3 wine64 imagemagick xvfb
      - run: bash tests/smoke_wine.sh
